version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blacklotus-vpn
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # Персистентная SQLite-БД
      - ../db-data:/app/db
    ports:
      - "8080:8080"
    # Пример healthcheck для API мини-приложения
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/plans"]
      interval: 30s
      timeout: 5s
      retries: 3
